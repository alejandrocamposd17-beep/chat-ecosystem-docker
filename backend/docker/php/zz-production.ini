; Seguridad
expose_php = Off

; OPcache: bytecode precompilado en memoria
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; En produccion el codigo no cambia dentro del contenedor
opcache.validate_timestamps = 0

; Adjuntos del chat: hasta 5 MB por archivo (la API valida el límite exacto)
upload_max_filesize = 6M
post_max_size = 8M
